<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bongshai Steel CMS</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-2: #172033; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --primary: #0466c8;
    --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  header .brand { font-weight: 800; letter-spacing: .3px; }
  header .spacer { flex: 1; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  header .dot.dirty { background: var(--warn); }
  button, .btn { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--panel-2); color: var(--text); padding: 8px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
  button.primary:hover { background: #0355a6; }
  button.ghost { background: transparent; }
  button.danger { border-color: var(--danger); color: #fca5a5; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .body { flex: 1; display: flex; min-height: 0; }
  nav { width: 190px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
        padding: 12px 8px; overflow-y: auto; }
  nav a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--muted);
          text-decoration: none; font-weight: 600; margin-bottom: 2px; }
  nav a:hover { color: var(--text); background: var(--panel-2); }
  nav a.active { color: #fff; background: var(--primary); }

  main { flex: 1; overflow-y: auto; padding: 26px 30px 80px; }
  main h1 { margin: 0 0 4px; font-size: 1.2rem; }
  main p.hint { margin: 0 0 22px; color: var(--muted); }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 18px 20px; margin-bottom: 18px; }
  .group h2 { margin: 0 0 14px; font-size: .95rem; color: var(--accent); text-transform: uppercase;
              letter-spacing: .6px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: 5px; color: #cbd5e1; }
  .field input[type=text], .field textarea, .field select {
      width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--text); font: inherit; }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field .sub { color: var(--muted); font-size: .78rem; margin-top: 4px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } nav { width: 140px; } }

  .card-list { display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .item .item-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .item .item-head strong { flex: 1; }
  .add-btn { margin-top: 4px; }

  table.products { width: 100%; border-collapse: collapse; }
  table.products th, table.products td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.products th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .5px; }
  table.products tr:hover td { background: var(--panel-2); }
  table.products img { width: 46px; height: 34px; object-fit: cover; border-radius: 4px; display: block; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; background: var(--panel);
          border: 1px solid var(--line); font-size: .74rem; color: var(--muted); }

  .imgpick { display: flex; align-items: center; gap: 12px; }
  .imgpick img { width: 90px; height: 66px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); }
  .imgpick .imgpick-controls { display: flex; flex-direction: column; gap: 6px; }
  .imgpick input[type=text] { min-width: 240px; }

  .overlay { position: fixed; inset: 0; background: rgba(2,6,23,.7); display: none; place-items: center; padding: 20px; z-index: 50; }
  .overlay.open { display: grid; }
  .modal { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--panel);
           border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .modal h3 { margin: 0 0 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 11px 20px;
           border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0,0,0,.4);
           opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.err { border-color: var(--danger); color: #fca5a5; }
  .toast.ok { border-color: var(--ok); color: #86efac; }

  .loading { padding: 60px; text-align: center; color: var(--muted); }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <span class="brand">Bongshai Steel CMS</span>
    <span class="dot" id="dirtyDot" title="No unsaved changes"></span>
    <span class="spacer"></span>
    <a class="btn ghost" href="../?cms=1" target="_blank" rel="noopener">Visual editor ↗</a>
    <button id="saveBtn" class="primary" disabled>Save changes</button>
    <button id="logoutBtn" class="ghost">Sign out</button>
  </header>

  <div class="body">
    <nav id="nav"></nav>
    <main id="main"><div class="loading">Loading…</div></main>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <script src="dashboard.js"></script>
</body>
</html>
